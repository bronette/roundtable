[project]
name = "roundtable"
version = "0.1.0"
description = "Multi-model AI collaboration orchestrator: propose, critique, revise, implement, test, review, synthesize."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "anthropic>=0.40",
    "openai>=1.50",
    "google-genai>=1.0",
    "ollama>=0.4",
]

[project.scripts]
roundtable = "roundtable.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["roundtable"]

[tool.pytest.ini_options]
testpaths = ["tests"]
