project:
  name: audit-optionstrader
  domain: trading
  repo: ../../OptionsTrader
  read_in_place: true              # audits: live checkout, so gitignored data/logs/reports are visible to every seat
  context_files:
    - ../../research/HYPOTHESIS_GATE.md
    - ../../LLM_ONBOARDING.md
  objective: >
    Audit OptionsTrader's paper daemon and candidate/reject ledger. Determine whether the strategy it runs
    (credit selection under a vol-regime gate) has any evidence of edge, whether the ledger and P&L it
    records are broker truth or bot-claimed, what the sample size of real entry cycles is, and whether the
    regime gate blocking entries is risk control working or a bug. Read README, docs/RUNBOOK.md, docs/decisions.md,
    the audit docs, the candidates table logic and the daemon's entry path. Verdict as the proposal's claim:
    KEEP (measuring a plausible edge correctly), KILL (no edge or cannot measure one), or NEEDS_EXPERIMENT
    (name the one experiment and its kill criterion).
  requirements:
    - "Every claim cites a file path, a recorded number, or a database query result from the repository; no general knowledge stands in for evidence"
    - "The verdict is one of KEEP, KILL, or NEEDS_EXPERIMENT, and for NEEDS_EXPERIMENT the single settling experiment is named with its kill criterion"
    - "The audit states what P&L or edge evidence exists, whether it is broker/venue truth or bot-claimed, and its sample size"
    - "Acceptance criteria describe what evidence would flip the verdict"
autonomy: 1
runs_dir: ../runs
pricing: pricing.yaml
budget: { max_rounds: 2, max_calls: 10, max_tokens: 900000, max_cost_usd: 12.0, max_seconds: 3600 }
providers:
  claude_cli: { type: cli, cli: claude }
  agy_cli:    { type: cli, cli: agy }
  grok_cli:   { type: cli, cli: grok }
agents:
  proposer:    { provider: claude_cli, mode: read, timeout_s: 900, max_turns: 80 }
  critic:      { provider: agy_cli, mode: read, model: gemini-3.1-pro-high, timeout_s: 900, max_turns: 60, fallback: claude_cli }
  reviser:     { provider: claude_cli, mode: read, timeout_s: 900, max_turns: 60 }
  synthesizer: { provider: claude_cli }
