# USD per million tokens. Keys match by exact model name, then by longest prefix.
# When a model is missing here, the CLI's own estimate is used if it reports one
# (Claude Code and Grok do; recorded as cost_source=reported). Otherwise cost is NULL
# and the run total shows "partly unknown" rather than an invented figure.
#
# Anthropic first-party API list prices, from Anthropic's model table (cached 2026-06-24).
# Subscription CLI calls are not billed at these rates; they show what a run would cost on the API.
models:
  claude-fable-5-1:   { input: 10.0, cached_input: 0.25, output: 50.0 }
  claude-fable-5:     { input: 10.0, cached_input: 0.25, output: 50.0 }
  claude-opus-5-5:    { input: 4.0,  cached_input: 0.20, output: 20.0 }
  claude-opus-5:      { input: 5.0,  cached_input: 0.50, output: 25.0 }
  claude-opus-4-8:    { input: 5.0,  cached_input: 0.50, output: 25.0 }
  claude-sonnet-5:    { input: 2.0,  cached_input: 0.20, output: 10.0 }
  claude-sonnet-4-6:  { input: 3.0,  cached_input: 0.30, output: 15.0 }
  claude-haiku-4-5:   { input: 1.0,  cached_input: 0.10, output: 5.0 }
  # Local models cost nothing.
  qwen3:              { input: 0.0, output: 0.0 }
  qwen2.5-coder:      { input: 0.0, output: 0.0 }
  deepseek-r1:        { input: 0.0, output: 0.0 }
  # Add OpenAI, xAI and Google rates here from their pricing pages when you want table
  # prices instead of vendor-reported estimates for those providers.
